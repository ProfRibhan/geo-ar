<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Geo-AR Bidang Tanah</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <script defer src="app.js"></script>
  <style>
    body { margin:0; overflow:hidden; }
    .hud {
      position: fixed; left: 8px; top: 8px; z-index: 9999;
      background: rgba(0,0,0,.55); color: white; padding: 8px 10px;
      font-family: Arial, sans-serif; font-size: 12px; border-radius: 8px;
      max-width: 90vw;
    }
  </style>
</head>
<body>
  <div class="hud" id="hud">Loading…</div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true;"
  >
    <!-- tempat entity hasil geojson akan dimasukkan -->
    <a-entity id="layer"></a-entity>

    <!-- kamera GPS -->
    <a-camera gps-camera rotation-reader></a-camera>
  </a-scene>
</body>
</html>
