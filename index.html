<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Geo-AR Bidang Tanah</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- Build ini umum dipakai untuk GPS/location-based AR -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script defer src="app.js"></script>

  <style>
    body { margin:0; overflow:hidden; }
    .hud{
      position:fixed; left:8px; top:8px; z-index:9999;
      background:rgba(0,0,0,.55); color:#fff; padding:10px 10px;
      font-family:Arial,sans-serif; font-size:12px; border-radius:10px;
      max-width:90vw;
    }
    .hud select, .hud button{
      width:100%;
      margin-top:6px;
      padding:8px 10px;
      border-radius:10px;
      border:none;
      font-size:13px;
    }
    .hud button{ cursor:pointer; }
    #nav { white-space:pre-line; margin-top:6px; line-height:1.25em; }
    #status { opacity:.95; }
    label { display:block; margin-top:6px; opacity:.9; }
  </style>
</head>

<body>
  <div class="hud" id="hud">
    <div id="status">Loading…</div>

    <label for="targetSelect">Target</label>
    <select id="targetSelect">
      <option value="">(Auto: terdekat)</option>
    </select>

    <div id="nav">-</div>

    <button id="btnCompass">Aktifkan Kompas</button>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true;"
  >
    <!-- marker hasil GeoJSON dimasukkan ke sini -->
    <a-entity id="layer"></a-entity>

    <!-- kamera GPS -->
    <a-camera gps-camera rotation-reader></a-camera>
  </a-scene>
</body>
</html>
